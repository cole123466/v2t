<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="V2T">
  <title>V2T</title>
  <!-- 深色圆角底（深色主题的 ink-900），在明暗两种标签栏底色下都有稳定对比 -->
  <rect width="64" height="64" rx="14" fill="#0a0a0e" />
  <!-- 五根圆头波形柱，中间高两侧低：呼应 landing 的 wave-bars 与站点金色强调色 -->
  <g fill="#d9a441">
    <rect x="4" y="23" width="8" height="18" rx="4" />
    <rect x="16" y="16" width="8" height="32" rx="4" />
    <rect x="28" y="9" width="8" height="46" rx="4" />
    <rect x="40" y="16" width="8" height="32" rx="4" />
    <rect x="52" y="23" width="8" height="18" rx="4" />
  </g>
</svg>
