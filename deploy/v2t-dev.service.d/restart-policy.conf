# 防「编辑中脚本被 Restart=always 反复拉起」雪崩：
# 2026-10-31 start.sh 编辑中间态被 3s 间隔连拉 15 次，大文件上传窗口内服务反复中断。
# 用指数退避代替「打到上限就 failed」：连续失败时间隔从 5s 逐步拉长到 120s，
# 60s 内启动次数始终远小于 StartLimitBurst，不会停在 failed（临时故障解除后仍能自愈）。
# 注意：RestartSteps/RestartMaxDelaySec 需要 systemd >= 254，低版本会退化为固定 RestartSec。
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=4

[Service]
RestartSec=5s
RestartSteps=5
RestartMaxDelaySec=120s
